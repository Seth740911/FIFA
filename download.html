<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FIFA 2026 下载</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#0a0a1a;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.header{width:100%;padding:20px 16px;text-align:center;background:linear-gradient(135deg,#1a1a2e,#16213e);border-bottom:1px solid #2a2a4a}
.header h1{font-size:1.3em;color:#d4a04a;margin-bottom:4px}
.header p{font-size:.8em;color:#888}
.main{width:100%;max-width:440px;padding:16px;flex:1}
.app-card{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:12px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .2s;text-decoration:none;color:inherit}
.app-card:hover{border-color:#d4a04a;transform:translateY(-1px);box-shadow:0 4px 16px rgba(212,160,74,.15)}
.app-card:active{transform:scale(.98)}
.app-icon{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.4em;flex-shrink:0}
.app-info{flex:1;min-width:0}
.app-name{font-size:1em;font-weight:600;color:#fff;margin-bottom:3px}
.app-desc{font-size:.75em;color:#888;line-height:1.4}
.app-size{font-size:.7em;color:#666;margin-top:2px}
.app-btn{background:#d4a04a;color:#000;border:none;border-radius:8px;padding:8px 16px;font-size:.8em;font-weight:600;cursor:pointer;white-space:nowrap}
.app-btn:hover{opacity:.9}

/* 微信引导遮罩 */
.wx-guide{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:flex-end;padding:20px 24px}
.wx-guide.show{display:flex}
.wx-guide .arrow{font-size:3em;color:#fff;margin-right:20px;animation:bounce 1s infinite}
.wx-guide .text{color:#fff;font-size:1.1em;line-height:1.8;text-align:center;margin-top:60px;padding:0 20px}
.wx-guide .text b{color:#d4a04a}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* 安装引导 */
.install-guide{display:none;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:12px;padding:20px;margin-top:16px}
.install-guide.show{display:block}
.install-guide h3{color:#d4a04a;font-size:.95em;margin-bottom:12px}
.install-guide .step{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.install-guide .num{background:#d4a04a;color:#000;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75em;font-weight:700;flex-shrink:0}
.install-guide .desc{font-size:.85em;color:#ccc;line-height:1.5}
.install-guide .desc b{color:#fff}

.footer{text-align:center;padding:16px;font-size:.7em;color:#555}
</style>
</head>
<body>

<div class="header">
  <h1>FIFA 2026</h1>
  <p>点击下载，浏览器会自动提示安装</p>
</div>

<div class="main" id="appList"></div>

<!-- 安装引导 -->
<div class="main" style="padding-top:0">
  <div class="install-guide" id="installGuide">
    <h3>📲 安装步骤</h3>
    <div class="step"><div class="num">1</div><div class="desc">下载完成后，<b>下拉通知栏</b>点击已下载的文件</div></div>
    <div class="step"><div class="num">2</div><div class="desc">如提示"未知来源"，点击<b>设置 → 允许安装</b></div></div>
    <div class="step"><div class="num">3</div><div class="desc">点击<b>安装</b>，等待完成后打开即可</div></div>
  </div>
</div>

<div class="footer">仅限 Android 设备 &middot; 安装时需开启"允许未知来源"</div>

<!-- 微信内引导遮罩 -->
<div class="wx-guide" id="wxGuide" onclick="this.classList.remove('show')">
  <div class="arrow">右上角 ↗</div>
  <div class="text">
    请先点击右上角 <b>···</b><br>
    选择 <b>在浏览器中打开</b><br>
    即可下载并安装
  </div>
</div>

<script>
var isWeChat = /MicroMessenger/i.test(navigator.userAgent);

var APK_LIST = [
  {file:'fifa.apk', name:'FIFA 2026', desc:'世界杯观赛指南', icon:'⚽', color:'#2d5a1e'}
];

var html = '';
APK_LIST.forEach(function(app) {
  var url = location.origin + '/apk/' + app.file;
  html += '<a class="app-card" href="' + url + '" onclick="return onDownload(event,\'' + app.file + '\')">';
  html += '<div class="app-icon" style="background:' + app.color + '">' + app.icon + '</div>';
  html += '<div class="app-info"><div class="app-name">' + app.name + '</div>';
  html += '<div class="app-desc">' + app.desc + '</div>';
  html += '<div class="app-size">' + app.file + '</div></div>';
  html += '<button class="app-btn">下载</button></a>';
});
document.getElementById('appList').innerHTML = html;

function onDownload(e, file) {
  if (isWeChat) {
    e.preventDefault();
    document.getElementById('wxGuide').classList.add('show');
    return false;
  }
  // 非微信：显示安装引导
  document.getElementById('installGuide').classList.add('show');
  return true;
}
</script>
</body>
</html>
